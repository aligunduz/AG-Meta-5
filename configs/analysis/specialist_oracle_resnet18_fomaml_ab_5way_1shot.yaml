dataset: meta-album
encoder: resnet18
data_root: ./materials/album_128
class_split_manifest: ./materials/album_128/geometry_cluster_ab_class_split.json
output_dir: ./save/specialist_oracle_resnet18_fomaml_ab_5way_1shot

seed: 0
tasks_per_cluster: 500
num_workers: 0
use_amp: false
keep_models_on_gpu: true

bootstrap:
  n_resamples: 10000
  confidence: 0.95
  seed: 1729

# Cluster membership is analysis input, not a convention in the Python code.
clusters:
  A:
    - ACT_40
    - ACT_410
    - SPT
  B:
    - RESISC
    - RSICB
    - RSD

test:
  root_path: ./materials/album_128
  split: meta-test
  allow_unassigned_classes: true
  class_split_manifest: ./materials/album_128/geometry_cluster_ab_class_split.json
  image_size: 128
  normalization: false
  transform: null
  n_batch: 250
  n_episode: 4
  n_way: 5
  n_shot: 1
  n_query: 15

# Noise floor: sample 30 queries/class, then evaluate on balanced 15+15 halves.
query_split:
  enabled: true
  n_query: 30
  split_query: 15

inner_args:
  reset_classifier: false
  n_step: 5
  encoder_lr: 0.01
  classifier_lr: 0.01
  momentum: 0.0
  weight_decay: 0.0
  first_order: true
  frozen:
    - bn

model_roles:
  specialists:
    A: A
    B: B
  reference: AB

models:
  A:
    load: ./save/FOMAML_resnet18_geometry_cluster_a/max-va.pth
    use_gradient_transport: false
  B:
    load: ./save/FOMAML_resnet18_geometry_cluster_b/max-va.pth
    use_gradient_transport: false
  AB:
    load: ./save/FOMAML_resnet18_geometry_cluster_ab/max-va.pth
    use_gradient_transport: false
