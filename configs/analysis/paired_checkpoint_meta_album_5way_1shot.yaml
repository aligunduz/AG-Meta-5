# Single-domain paired evaluation.  Change only `domain`, `n_episodes`, the
# manifest path, and the two model names/paths to reuse this file.
# Intended comparisons:
#   TEX:    C vs mixed3
#   RESISC: B vs mixed3
#   SPT:    A vs mixed3
mode: paired_checkpoints
dataset: meta-album
encoder: resnet18
domain: TEX
n_episodes: 500
seed: 0

class_split_manifest: ./materials/album_128/geometry_cluster_abc_class_split.json

num_workers: 0
keep_models_on_gpu: true

# These explicit values follow test.py's precision resolution and override any
# corresponding values embedded in either checkpoint.
use_amp: true
amp_dtype: bfloat16
allow_tf32: true
use_gradient_transport: false

test:
  root_path: ./materials/album_128
  split: meta-test
  allow_unassigned_classes: true
  image_size: 128
  normalization: false
  transform: null
  n_episode: 4       # loader batch size; total rows are controlled above
  n_way: 5
  n_shot: 1
  n_query: 15

inner_args:
  reset_classifier: false
  n_step: 5
  encoder_lr: 0.01
  classifier_lr: 0.01
  momentum: 0.0
  weight_decay: 0.0
  first_order: true
  frozen:
    - bn

# YAML order defines the signed CSV differences: first model minus second.
# RESISC preset: domain RESISC, first model B, checkpoint
#   ./save/FOMAML_resnet18_geometry_cluster_b/max-va.pth
# SPT preset: domain SPT, first model A, checkpoint
#   ./save/FOMAML_resnet18_geometry_cluster_a/max-va.pth
# In both presets, keep mixed3 as the second model.
models:
  C:
    load: ./save/FOMAML_resnet18_geometry_cluster_c/max-va.pth
  mixed3:
    load: ./save/FOMAML_resnet18_geometry_cluster_mixed3/max-va.pth
