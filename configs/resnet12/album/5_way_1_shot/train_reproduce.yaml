dataset: meta-album

train:
  root_path: materials/album_128
  split: meta-train
  allow_unassigned_classes: true
  domains: ['ACT_40', 'ACT_410', 'SPT']
  class_split_manifest: materials/album_128/geometry_cluster_a_class_split.json
  image_size: 128
  normalization: False
  transform: null
  n_batch: 200
  n_episode: 4
  n_way: 5
  n_shot: 1
  n_query: 15

val_interval: 5

val:
  root_path: materials/album_128
  split: meta-val
  allow_unassigned_classes: true
  domains: ['ACT_40', 'ACT_410', 'SPT']
  class_split_manifest: materials/album_128/geometry_cluster_a_class_split.json
  image_size: 128
  normalization: False
  transform: null
  n_batch: 100
  n_episode: 6
  n_way: 5
  n_shot: 1
  n_query: 15

encoder: resnet12
encoder_args:
  bn_args:
    track_running_stats: False
classifier: logistic

inner_args:
  n_step: 5
  encoder_lr: 0.01
  classifier_lr: 0.01
  first_order: False  # set to True for FOMAML
  frozen:
    - bn

optimizer: adam
optimizer_args:
  lr: 0.001

use_gradient_transport: false
use_amp: true
amp_dtype: bfloat16
allow_tf32: true
epoch: 200
