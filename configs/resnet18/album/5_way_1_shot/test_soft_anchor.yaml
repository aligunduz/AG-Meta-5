dataset: meta-album
test:
  root_path: materials/album_128
  split: meta-test
  allow_unassigned_classes: true
  domains: [ ACT_40, ACT_410, SPT, RESISC, RSICB, RSD, TEX, TEX_ALOT, TEX_DTD ]
  class_split_manifest: materials/album_128/geometry_cluster_abc_class_split.json
  image_size: 128
  normalization: False
  transform: null
  n_batch: 150
  n_episode: 4
  n_way: 5
  n_shot: 1
  n_query: 15

load: save/FOMAML_resnet18_soft_anchor_k3_top2_tau05/max-va.pth

inner_args:
  n_step: 5
  encoder_lr: 0.01
  classifier_lr: 0.01
  first_order: true
  frozen: [bn]
  reset_classifier: false
  momentum: 0.0
  weight_decay: 0.0

use_gradient_transport: false
use_amp: true
amp_dtype: bfloat16
allow_tf32: true
epoch: 10

wandb:
  enabled: true
  project: ag-meta-5-5_way_1_shot
  tags: [soft-anchor, k3, top2, tau05]